spring.application.name=server

#mc server address
mcstatus.api.base-url=https://api.mcstatus.io/v2
mcstatus.server.address=

#sqlite database
spring.datasource.url=jdbc:sqlite:src/main/resources/db/betterserver.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

#frontend
client.vite.url=http://localhost:3000