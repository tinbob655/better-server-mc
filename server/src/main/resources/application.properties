spring.application.name=server

#mc server address
mcstatus.api.base-url=https://api.mcstatus.io/v2
mcstatus.server.address=

#sqlite database
spring.datasource.url=jdbc:sqlite:src/main/resources/db/betterserver.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

#frontend
client.vite.url=http://localhost:3000

#authentication
jwt.secret=
jwt.expiration-ms=604800000

#limit max size of uploaded files
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

#for fetching mc player information
mcstats.world-stats-directory=
mcstats.import-interval-ms=3600000